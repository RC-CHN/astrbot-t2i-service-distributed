version: '3.8'

services:
  app:
    image: ghcr.io/rc-chn/astrbot-t2i-service-distributed:latest
    build: .
    ports:
      - "8999:8999"
    environment:
      # 应用服务直接指向 MinIO
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET_NAME=text2img
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - minio
      - redis
    volumes:
      # 挂载模板目录，如果使用 tmplname 功能
      - ./tmpl:/app/tmpl

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-ttl} --save ""
    volumes:
      - redis_data:/data

volumes:
  minio_data:
  redis_data: